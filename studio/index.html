<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartographer Galería</title>
<style>
:root{--bg:#121212;--panel:#1c1c1c;--borde:#333;--texto:#f1ece1;--suave:#a39e93;--acento:#d9a441}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--texto);font:15px Georgia,serif}
header{position:sticky;top:0;z-index:5;background:rgba(18,18,18,.96);border-bottom:1px solid var(--borde);padding:12px 16px}
h1{margin:0 0 8px;font-size:22px;color:var(--acento);letter-spacing:.03em}h1 a{color:var(--suave);font-size:13px;margin-left:12px}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:14px system-ui,sans-serif;color:var(--texto);background:#262626;border:1px solid var(--borde);border-radius:6px;padding:8px 10px}
input[type=text]{flex:1;min-width:180px}button{cursor:pointer}button.on{background:var(--acento);color:#111}
#estado{color:var(--suave);font:13px system-ui;margin-top:6px}
#cartos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}#cartos button{padding:4px 9px;font-size:12px}
main{padding:16px;columns:4 300px;column-gap:14px}
figure{break-inside:avoid;margin:0 0 14px;background:var(--panel);border:1px solid var(--borde);border-radius:8px;overflow:hidden;cursor:zoom-in}
figure img{width:100%;display:block;background:#0c0c0c;min-height:120px}
figcaption{padding:8px 10px;font-size:13px;line-height:1.35}figcaption b{color:var(--acento)}figcaption small{display:block;color:var(--suave);font:11px system-ui;margin-top:4px}
#visor{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;z-index:10;flex-direction:column}
#visor.ab{display:flex}#visor .img{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
#visor img{max-width:100%;max-height:100%}#visor.z img{max-width:none;max-height:none}
#visor .pie{padding:10px 16px;font-size:14px;border-top:1px solid var(--borde)}#visor .pie a{color:var(--acento)}
#cerrar{position:absolute;top:10px;right:14px;font-size:22px}
#mas{display:block;margin:10px auto 40px}
</style>
</head>
<body>
<header>
  <h1>Cartographer · Mapas históricos reales <a href="estudio.html">abrir estudio de edición →</a></h1>
  <div class="fila">
    <input id="q" type="text" placeholder="País o región: Colombia, Turquía, Anatolia, Castilla…" list="sug">
    <datalist id="sug"></datalist>
    <select id="siglo"><option value="">Todos los siglos</option></select>
    <input id="filtro" type="text" placeholder="Filtrar por palabra del título (Mercator, mapa, plano…)" style="flex:.7">
    <label style="font:13px system-ui"><input type="checkbox" id="antiguos" checked> solo hasta 1900</label>
    <button id="ir">Buscar</button>
  </div>
  <div id="cartos"></div>
  <div id="estado">Escribe un país o elige un cartógrafo.</div>
</header>
<main id="galeria"></main>
<button id="mas" hidden>Cargar más</button>
<div id="visor"><button id="cerrar">✕</button><div class="img"><img alt=""></div><div class="pie"></div></div>
<script>
const $=(i)=>document.getElementById(i);
const norm=(t)=>t.normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const romano=(n)=>{let r='';for(const[k,s]of[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']])while(n>=k){r+=s;n-=k}return r};
let NOMBRES={},PAISES={},lista=[],pos=0;const PAGINA=60;
async function json(u){const r=await fetch(u);return r.json()}
async function jsonlGz(u){const r=await fetch(u);if(!r.ok)return[];const b=new Uint8Array(await r.arrayBuffer());
  const t=(b[0]===0x1f&&b[1]===0x8b)?await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text():new TextDecoder().decode(b);
  return t.split('\n').filter(Boolean).map(JSON.parse)}
function grande(m){
  if(m.iiif)return m.iiif.replace(/\/info\.json$/,'')+'/full/1600,/0/default.jpg';
  const t=m.th||'';
  if(/upload\.wikimedia|thumb\.wikimedia/.test(t))return t.replace(/\/\d+px-([^/]+)$/,'/1600px-$1');
  return t}
function mini(m){if(m.th)return m.th;if(m.iiif)return m.iiif.replace(/\/info\.json$/,'')+'/full/500,/0/default.jpg';return''}
function resolver(q){const n=norm(q);if(NOMBRES[n])return NOMBRES[n];
  const iso=Object.keys(PAISES).find(k=>norm(PAISES[k].nombre)===n);if(iso)return{iso:[iso]};
  const k=Object.keys(NOMBRES).find(k=>k.startsWith(n));return k?NOMBRES[k]:null}
function filtrar(ms){const s=+$('siglo').value,f=norm($('filtro').value),ant=$('antiguos').checked;
  return ms.filter(m=>(m.th||m.iiif)&&(!s||(m.siglos||[]).includes(s)||(m.anio&&Math.ceil(m.anio/100)===s))
    &&(!ant||!m.anio||m.anio<=1900)&&(!f||norm(m.t+' '+(m.autor||'')).includes(f)))
   .sort((a,b)=>(b.relevancia||0)-(a.relevancia||0)||(a.anio||9999)-(b.anio||9999))}
async function buscarPais(){const r=resolver($('q').value);
  if(!r){$('estado').textContent='No reconozco ese lugar. Prueba con el nombre del país.';return}
  const isos=[...new Set([...(r.iso||[]),...(r.region||[]).map(x=>x[1])])];
  $('estado').textContent='Cargando…';let ms=[];for(const i of isos)ms=ms.concat(await jsonlGz('biblioteca/paises/'+i+'.jsonl.gz'));
  const regs=new Set((r.region||[]).map(x=>x[0]));if(regs.size&&!(r.iso||[]).length)ms=ms.filter(m=>(m.regiones||[]).some(x=>regs.has(x)));
  mostrar(filtrar(ms),(r.iso||[]).map(i=>PAISES[i]?.nombre||i).concat((r.region||[]).map(x=>x[2])).slice(0,3).join(', '))}
async function buscarCarto(k,nombre){document.querySelectorAll('#cartos button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  $('estado').textContent='Cargando…';mostrar(filtrar(await json('datos/cartografos/'+k+'.json')),nombre)}
function mostrar(ms,titulo){lista=ms;pos=0;$('galeria').innerHTML='';
  $('estado').textContent=`${titulo}: ${ms.length.toLocaleString('es')} mapas con imagen`;pintar()}
function pintar(){const g=$('galeria');
  for(const m of lista.slice(pos,pos+PAGINA)){const f=document.createElement('figure');
    f.innerHTML='<img loading="lazy" alt=""><figcaption><b></b> <span></span><small></small></figcaption>';
    const img=f.querySelector('img');img.src=mini(m);img.onerror=()=>f.remove();
    f.querySelector('b').textContent=m.anio||'s/f';f.querySelector('span').textContent=m.t.slice(0,140);
    f.querySelector('small').textContent=[m.autor&&!/^https?:/.test(m.autor)?m.autor.slice(0,60):'',m.fuente,m.lic].filter(Boolean).join(' · ');
    f.onclick=()=>abrir(m);g.appendChild(f)}
  pos+=PAGINA;$('mas').hidden=pos>=lista.length}
function abrir(m){const v=$('visor');v.classList.add('ab');v.classList.remove('z');const img=v.querySelector('img');
  img.src=mini(m);const g=grande(m);if(g&&g!==img.src){const p=new Image();p.onload=()=>img.src=g;p.src=g}
  v.querySelector('.pie').innerHTML='';const pie=v.querySelector('.pie');
  pie.append(`${m.anio||'sin fecha'} · ${m.t}`);pie.appendChild(document.createElement('br'));
  const s=document.createElement('small');s.textContent=`Licencia: ${m.lic} · `;const a=document.createElement('a');
  a.href=m.url;a.target='_blank';a.rel='noopener';a.textContent='ver en el archivo original (máxima calidad)';s.appendChild(a);pie.appendChild(s)}
$('cerrar').onclick=()=>$('visor').classList.remove('ab');
$('visor').querySelector('.img').onclick=()=>$('visor').classList.toggle('z');
document.onkeydown=(e)=>e.key==='Escape'&&$('visor').classList.remove('ab');
$('ir').onclick=buscarPais;$('q').onkeydown=(e)=>e.key==='Enter'&&buscarPais();$('mas').onclick=pintar;
$('siglo').onchange=$('antiguos').onchange=()=>$('q').value&&buscarPais();
$('filtro').onkeydown=(e)=>e.key==='Enter'&&buscarPais();
(async()=>{[NOMBRES,PAISES]=await Promise.all([json('datos/nombres.json'),json('datos/paises.json')]);
  for(let s=1;s<=20;s++)$('siglo').add(new Option('Siglo '+romano(s),s));
  for(const i of Object.keys(PAISES).sort((a,b)=>PAISES[b].total-PAISES[a].total))$('sug').appendChild(new Option(PAISES[i].nombre));
  const C=await json('datos/cartografos.json');
  for(const[k,v]of Object.entries(C).sort((a,b)=>b[1].total-a[1].total)){const b=document.createElement('button');b.dataset.k=k;
    b.textContent=`${v.nombre} (${v.total})`;b.onclick=()=>buscarCarto(k,v.nombre);$('cartos').appendChild(b)}
  const h=new URLSearchParams(location.search).get('q');if(h){$('q').value=h;buscarPais()}})();
</script>
</body>
</html>
