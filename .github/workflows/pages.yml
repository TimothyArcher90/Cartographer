name: Estudio web (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ["studio/**", "scripts/construir_cartografos.py", "catalogo/biblioteca/**", "paquetes/cartographer/epocas/**", "visor/vendor/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        run: |
          mkdir -p sitio/biblioteca
          cp studio/*.html studio/app.js sitio/
          cp -r studio/datos visor/vendor paquetes/cartographer/epocas sitio/
          cp -r catalogo/biblioteca/paises sitio/biblioteca/
          touch sitio/.nojekyll
      - name: Publicar en la rama gh-pages
        run: |
          cd sitio
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Publicar estudio web (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
